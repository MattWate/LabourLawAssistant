<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>VRS Payment Flow Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700;800&display=swap');:root{--navy:#000B4F;--blue:#20368F;--soft:#829CD0;--pale:#EBEBEB;--text:#111735;--muted:#536078;--green:#2f8f63;--amber:#b7791f;--red:#a43f42;--border:rgba(130,156,208,.38)}*{box-sizing:border-box}body{margin:0;font-family:Quicksand,Arial,sans-serif;background:linear-gradient(145deg,#fff,#f7f8fc 55%,#EBEBEB);color:var(--text)}button,input,textarea{font:inherit}.wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;min-height:100vh;padding:18px}.card{background:rgba(255,255,255,.82);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 18px 54px rgba(0,11,79,.1)}.side,.main{height:calc(100vh - 36px);overflow:auto}h1,h2,h3{margin-top:0;color:var(--navy)}p{color:var(--muted);line-height:1.5}.field,.textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px}.textarea{min-height:160px}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--text);margin:3px}.btn.primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.btn.success{background:linear-gradient(135deg,#20724d,#72b88f);color:#fff}.btn.warn{background:linear-gradient(135deg,#b7791f,#e7b86a);color:#111}.btn:disabled{opacity:.55;cursor:not-allowed}.case{padding:13px;border:1px solid var(--border);border-radius:18px;background:#fff;margin-bottom:10px;cursor:pointer}.case.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(130,156,208,.22)}.name{font-weight:800;color:var(--navy)}.summary{font-size:.86rem;color:var(--muted);margin-top:5px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;border-radius:999px;padding:5px 8px;background:rgba(130,156,208,.16);color:var(--blue)}.green{background:rgba(47,143,99,.16);color:var(--green)}.amber{background:rgba(183,121,31,.16);color:var(--amber)}.red{background:rgba(164,63,66,.15);color:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}.fact{border:1px solid var(--border);border-radius:16px;padding:12px;background:#fff}.label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:6px}.value{white-space:pre-wrap;word-break:break-word}.raw{background:#000B4F;color:#eef3ff;border-radius:16px;padding:14px;overflow:auto;white-space:pre-wrap}.login{max-width:560px;margin:7vh auto}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;display:none}.toast.show{display:block}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.small{font-size:.88rem;color:var(--muted)}</style></head><body>
<section id="login" class="card login"><h1>VRS Admin Flow</h1><p>Focused payment and drafting page. It uses the same backend as the main workstation.</p><input id="supabase-url" class="field" placeholder="Supabase URL"/><input id="supabase-key" class="field" placeholder="Supabase anon key"/><input id="email" class="field" placeholder="Admin email"/><input id="password" type="password" class="field" placeholder="Password"/><button class="btn primary" onclick="login()">Save and login</button><p id="login-error" class="small" style="color:var(--red)"></p></section>
<main id="app" class="wrap hidden"><aside class="card side"><div class="top"><div><h2>Cases</h2><p class="small">Payment, drafting and review queue.</p></div><button class="btn" onclick="fetchCases()">Refresh</button></div><input id="search" class="field" placeholder="Search..." oninput="renderList()"/><div id="cases"></div></aside><section class="main" id="detail"></section></main><div id="toast" class="toast"></div>
<script>let db=null,token=null,cases=[],selected=null,lastPayment=null;function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function val(v,f='—'){return v===null||v===undefined||v===''?f:String(v)}function bool(v){return v===true||String(v).toLowerCase()==='true'}function headers(){return{'Content-Type':'application/json','Authorization':'Bearer '+token}}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3300)}function init(){const u=localStorage.getItem('vrs_supabase_url')||'';const k=localStorage.getItem('vrs_supabase_key')||'';$('supabase-url').value=u;$('supabase-key').value=k;if(u&&k)db=supabase.createClient(u,k)}async function login(){try{const u=$('supabase-url').value.trim(),k=$('supabase-key').value.trim();if(!u||!k)throw new Error('Add Supabase URL and anon key.');localStorage.setItem('vrs_supabase_url',u);localStorage.setItem('vrs_supabase_key',k);db=supabase.createClient(u,k);const{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;token=data.session.access_token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await fetchCases()}catch(e){$('login-error').textContent=e.message}}async function fetchCases(){const res=await fetch('/.netlify/functions/get_cases',{headers:headers()});if(!res.ok){toast('Could not load cases');return}cases=await res.json();if(!selected&&cases.length)selected=cases[0].id;renderList();renderDetail()}function facts(c){return c?.case_facts||{}}function ed(c){const f=facts(c);return f.effective_decision||f.admin_override||f}function badges(c){const f=facts(c),paid=c.payment_status||f.payment_status,unlocked=c.wp_generation_unlocked||f.wp_generation_unlocked;let a=[];if(bool(ed(c).wp_eligible))a.push('<span class="badge green">WP</span>');if(paid)a.push('<span class="badge '+(paid==='paid'?'green':'amber')+'">'+esc(paid)+'</span>');if(unlocked)a.push('<span class="badge green">Unlocked</span>');if(c.letter_status)a.push('<span class="badge">'+esc(c.letter_status)+'</span>');return a.join('')}function renderList(){const q=($('search').value||'').toLowerCase();const rows=cases.filter(c=>[c.client_name,c.issue_summary,JSON.stringify(c.case_facts||{})].join(' ').toLowerCase().includes(q));$('cases').innerHTML=rows.map(c=>{const f=facts(c);return '<div class="case '+(c.id===selected?'active':'')+'" onclick="selected=\''+c.id+'\';lastPayment=null;renderList();renderDetail()"><div class="name">'+esc(f.client_name||c.client_name||'Anonymous')+'</div><div class="summary">'+esc((f.incident_description||c.issue_summary||'No summary').slice(0,120))+'</div><div class="badges">'+badges(c)+'</div></div>'}).join('')||'<p>No cases found.</p>'}function renderDetail(){const c=cases.find(x=>x.id===selected);if(!c){$('detail').innerHTML='<div class="card">Select a case.</div>';return}const f=facts(c),e=ed(c);$('detail').innerHTML='<div class="card"><div class="top"><div><h1>'+esc(f.client_name||c.client_name||'Anonymous Client')+'</h1><p class="small">Case ID: '+esc(c.id)+'</p></div><button class="btn" onclick="fetchCases()">Refresh</button></div><div class="badges">'+badges(c)+'<span class="badge">'+esc(e.track||'UNCLASSIFIED')+'</span><span class="badge">'+esc(e.merit_band||'REVIEW')+'</span></div></div>'+paymentCard(c)+draftCard(c)+factsCard(c)+rawCard(c)}function paymentCard(c){const f=facts(c),wp=bool(ed(c).wp_eligible),paid=(c.payment_status||f.payment_status)==='paid',unlocked=bool(c.wp_generation_unlocked||f.wp_generation_unlocked);let html='<div class="card"><h2>Payfast Payment</h2><div class="grid"><div class="fact"><span class="label">Payment Status</span><div class="value">'+esc(c.payment_status||f.payment_status||'not requested')+'</div></div><div class="fact"><span class="label">WP Generation</span><div class="value">'+(unlocked?'Unlocked':'Locked')+'</div></div></div><p>'+(wp?'This case is WP eligible. Create a Payfast link before generating the protected WP draft.':'This case is not currently WP eligible. Override eligibility before requesting payment.')+'</p><button class="btn warn" '+(!wp?'disabled':'')+' onclick="createPayment(\''+c.id+'\')">Create Payfast Link</button><button class="btn" onclick="checkPayment(\''+c.id+'\')">Check Payment</button>';if(lastPayment&&lastPayment.caseId===c.id){html+='<textarea class="textarea" readonly>'+esc(lastPayment.payment_url||'')+'</textarea><button class="btn primary" onclick="openPayLink()">Open Link</button><button class="btn" onclick="copyPayLink()">Copy Link</button>'}return html+'</div>'}function draftCard(c){const f=facts(c),paid=(c.payment_status||f.payment_status)==='paid',unlocked=bool(c.wp_generation_unlocked||f.wp_generation_unlocked),canDraft=paid||unlocked;if(c.draft_letter)return '<div class="card"><h2>Draft Letter</h2><textarea id="draft" class="textarea" style="min-height:340px">'+esc(c.draft_letter)+'</textarea><button class="btn" onclick="saveDraft(\''+c.id+'\',\'pending_review\')">Save</button><button class="btn success" onclick="saveDraft(\''+c.id+'\',\'approved\')">Approve</button></div>';return '<div class="card"><h2>WP Drafting</h2><p>'+(canDraft?'Payment confirmed or generation unlocked.':'Drafting is locked until payment is confirmed.')+'</p><button class="btn primary" '+(!canDraft?'disabled':'')+' onclick="generateDraft(\''+c.id+'\')">Generate Protected WP Draft</button></div>'}function factsCard(c){const f=facts(c);return '<div class="card"><h2>Key Facts</h2><div class="grid">'+fact('Employer',f.employer_name)+fact('Contact',f.contact_info||c.contact_info)+fact('Track',f.track)+fact('Merit',f.merit_band)+fact('WP Eligible',f.wp_eligible)+fact('Wants Letter',f.wants_letter)+fact('Incident',f.incident_description||c.issue_summary,true)+'</div></div>'}function fact(l,v,w=false){return '<div class="fact '+(w?'wide':'')+'"><span class="label">'+esc(l)+'</span><div class="value">'+esc(val(v))+'</div></div>'}function rawCard(c){return '<div class="card"><h2>Raw case_facts</h2><pre class="raw">'+esc(JSON.stringify(facts(c),null,2))+'</pre></div>'}async function createPayment(id){try{const res=await fetch('/.netlify/functions/create_payfast_payment',{method:'POST',headers:headers(),body:JSON.stringify({caseId:id})});const data=await res.json();if(!res.ok||!data.success)throw new Error(data.error||'Could not create payment');lastPayment={caseId:id,...data};toast('Payfast link created');await fetchCases();selected=id;renderDetail()}catch(e){toast(e.message)}}async function checkPayment(id){try{const res=await fetch('/.netlify/functions/check_payment_status?caseId='+encodeURIComponent(id));const data=await res.json();toast(data.payment?'Payment status: '+data.payment.status:'No payment found yet');await fetchCases();selected=id;renderDetail()}catch(e){toast(e.message)}}function openPayLink(){if(lastPayment?.payment_url)window.open(lastPayment.payment_url,'_blank')}async function copyPayLink(){if(!lastPayment?.payment_url)return;navigator.clipboard.writeText(lastPayment.payment_url);toast('Payment link copied')}async function generateDraft(id){try{const res=await fetch('/.netlify/functions/generate_letter',{method:'POST',headers:headers(),body:JSON.stringify({caseId:id})});const data=await res.json();if(!res.ok||data.success===false)throw new Error(data.error||data.message||'Draft failed');toast('Draft generated');await fetchCases();selected=id;renderDetail()}catch(e){toast(e.message)}}async function saveDraft(id,status){const draft=$('draft').value;const res=await fetch('/.netlify/functions/update_case',{method:'POST',headers:headers(),body:JSON.stringify({id,draft_letter:draft,letter_status:status})});if(!res.ok){toast('Save failed');return}toast(status==='approved'?'Draft approved':'Draft saved');await fetchCases()}init();</script></body></html>
