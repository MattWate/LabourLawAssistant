<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Justine UAT Intake Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#18202b;background:#eef2f6}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #d8e0e8;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #b9c4d0}button{cursor:pointer;background:#172b4d;color:white}.ghost{background:white;color:#172b4d}
.case{padding:12px;border-bottom:1px solid #e5e9ee;cursor:pointer}.case:hover{background:#f6f8fa}.small{font-size:12px;color:#667}.flag{display:inline-block;padding:4px 7px;border-radius:999px;margin:2px;font-size:11px;background:#eee}.critical{background:#ffd5d5}.high{background:#ffe5cf}.medium{background:#fff2bf}
pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fa;padding:12px;border-radius:8px;max-height:460px;overflow:auto}.section{margin-top:16px}.section h3{margin:0 0 8px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.fact{background:#f6f8fa;border-radius:8px;padding:10px}.fact strong{display:block;font-size:11px;color:#667;text-transform:uppercase}.warn{background:#fff4d6;border:1px solid #e8c66a;padding:12px;border-radius:8px;margin-bottom:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>Justine UAT Intake Review</h1>
<p>Read-only review of persisted case, intake, provenance, deadline, WhatsApp and progression state.</p>
<div id="auth" class="card"><h3>VRS sign-in</h3><input id="email" placeholder="Email"/><input id="password" type="password" placeholder="Password"/><button onclick="login()">Sign in</button><span id="authStatus" class="small"></span></div>
<div id="app" style="display:none">
<div id="warning" class="warn"></div>
<div class="card"><input id="search" style="width:min(650px,70%)" placeholder="Search reference, client, employer, track or flag"/><button onclick="loadList()">Search</button><button class="ghost" onclick="loadList(true)">Refresh</button></div>
<div class="grid"><div class="card"><div id="list">Loading…</div></div><div id="detail" class="card">Select a case.</div></div>
</div></div>
<script>
const SUPABASE_URL=window.JUSTINE_SUPABASE_URL||'https://pdjhgszpndwykeqlusho.supabase.co';
const SUPABASE_ANON_KEY=window.JUSTINE_SUPABASE_ANON_KEY||'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkamhnc3pwbmR3eWtlcWx1c2hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMTgwNjAsImV4cCI6MjA4NTY5NDA2MH0.5Y_YlNa16Z6LbK12DQQ-zAWX6QeY-hgPJt3jl_t4dLU';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function token(){const {data}=await db.auth.getSession();if(!data.session)throw new Error('Sign in required');return data.session.access_token}
async function api(q=''){const t=await token();const r=await fetch('/.netlify/functions/uat_log_review'+q,{headers:{Authorization:'Bearer '+t},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});authStatus.textContent=error?error.message:'Signed in';if(!error)start()}
async function start(){auth.style.display='none';app.style.display='block';await loadList()}
function badges(flags=[]){return flags.map(f=>'<span class="flag '+esc(f.severity)+'" title="'+esc(f.text)+'">'+esc(f.code)+'</span>').join('')}
async function loadList(){try{const q=search.value.trim();const d=await api('?q='+encodeURIComponent(q));warning.textContent=d.transcript_warning;list.innerHTML=d.items.map(x=>'<div class="case" onclick="openCase(\''+x.id+'\')"><strong>'+esc(x.case_reference)+'</strong><br>'+esc(x.client_name)+' · '+esc(x.employer_name)+'<br><span class="small">'+esc(x.track)+' · '+esc(x.status)+' · '+new Date(x.updated_at).toLocaleString()+'</span><div>'+badges(x.flags)+'</div></div>').join('')||'No matching cases.'}catch(e){list.textContent=e.message}}
function fact(k,v){return '<div class="fact"><strong>'+esc(k)+'</strong>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</div>'}
function block(title,obj){return '<div class="section"><h3>'+esc(title)+'</h3><pre>'+esc(JSON.stringify(obj,null,2))+'</pre></div>'}
async function openCase(id){detail.innerHTML='Loading…';try{const d=await api('?caseId='+encodeURIComponent(id));const x=d.items[0],r=x.review||{};detail.innerHTML='<h2>'+esc(x.case_reference)+' — '+esc(x.client_name)+'</h2><div>'+badges(r.flags)+'</div><div class="facts">'+fact('Employer',x.employer_name)+fact('Track',r.decision?.effective_track)+fact('Case status',r.progression?.case_status)+fact('Letter status',r.progression?.letter_status)+fact('Payment',r.progression?.payment_status)+fact('Prompt count',r.intake?.prompt_count)+fact('Legal date',r.dates?.legal_date)+fact('Deadline',r.dates?.ccma_deadline_status?.status||r.dates?.determination_time_bar?.status)+fact('Email',r.contact?.client_email)+fact('WhatsApp',r.contact?.whatsapp_number||r.contact?.legacy_contact)+'</div>'+
block('Diagnostic flags',r.flags)+block('Intake / prompt history',r.intake)+block('Contact',r.contact)+block('Date provenance / deadline',r.dates)+block('Decision / outcome',r.decision)+block('Mandate / payment / progression',r.progression)+block('PayFast / payment provider audit',r.payments||[])+block('WhatsApp state',r.whatsapp)+block('Fact provenance / LLM audit',r.provenance)+block('Raw case record',x.raw_case)+'<div class="section"><button onclick="downloadCase(\''+id+'\')">Export review JSON</button></div>'}catch(e){detail.textContent=e.message}}
async function downloadCase(id){const d=await api('?caseId='+encodeURIComponent(id));const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='justine-uat-review-'+id+'.json';a.click();URL.revokeObjectURL(a.href)}
db.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
