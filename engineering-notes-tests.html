<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justine Engineering Notes Regression Tests</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background: #f8fafc; color: #0f172a; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
    button { display: block; padding: 12px 14px; cursor: pointer; border: 1px solid #7c3aed; border-radius: 8px; background: white; color: #5b21b6; font-weight: 700; text-align: left; }
    button:hover { background: #7c3aed; color: white; }
    .note { background: #fff7ed; border: 1px solid #fed7aa; padding: 12px 14px; border-radius: 8px; margin-bottom: 20px; }
    .status { margin: 18px 0; padding: 16px; border-radius: 10px; font-weight: 800; display: none; }
    .status.pass { display: block; background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status.fail { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status.running { display: block; background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .checks { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 18px; display: none; }
    .checks h3 { margin: 0 0 10px; font-size: 1rem; }
    .check { padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: .95rem; }
    .check:last-child { border-bottom: 0; }
    .ok { color: #166534; font-weight: 800; }
    .bad { color: #991b1b; font-weight: 800; }
    pre { background: #111827; color: #e5e7eb; padding: 16px; white-space: pre-wrap; border-radius: 8px; min-height: 360px; overflow-x: auto; }
    code { background: #e2e8f0; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Justine Engineering Notes Regression Tests</h1>
  <p>These tests target the client feedback from the 7 May engineering notes.</p>

  <div class="note">
    <strong>Important:</strong> These currently call <code>/.netlify/functions/ask</code> with <code>action: evaluate</code>, so they create real test rows in the <code>cases</code> table.
  </div>

  <div class="grid">
    <button onclick="runTest('whistleblowerMisconduct')">EN Test 01: Whistleblower disguised as misconduct</button>
    <button onclick="runTest('pregnancyRetrenchment')">EN Test 02: Pregnancy disguised as retrenchment</button>
    <button onclick="runTest('cdDiscriminationOverlay')">EN Test 03: CD with discrimination overlay</button>
  </div>

  <div id="status" class="status">Choose a test...</div>
  <div id="checks" class="checks"></div>

  <h2>Raw Result</h2>
  <pre id="output">Choose a test...</pre>

  <script>
    const output = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const checksEl = document.getElementById('checks');

    function recentDate(daysAgo = 2) {
      const date = new Date();
      date.setDate(date.getDate() - daysAgo);
      return date.toISOString().slice(0, 10);
    }

    const baseFacts = {
      worker_status: 'Employee', contract_type: 'Employee', south_african_employer: 'yes',
      public_service_or_excluded_agency: 'no', schedule_2_soe_ccma_eligible: 'no',
      employer_name: 'ENGINEERING NOTE TEST EMPLOYER', employer_contact_details: 'hr@testcase.example',
      client_name: 'ENGINEERING NOTE TEST USER', contact_info: '0820000000'
    };

    const cases = {
      whistleblowerMisconduct: {
        ...baseFacts,
        employment_status: 'Dismissed', dismissal_reason_type: 'Misconduct', incident_date: recentDate(3),
        misconduct_category: 'insubordination', conduct_admission: 'Dispute', hearing_held: false,
        prior_warnings: 'None', length_of_service: '2-5y', tenure: '2-5y', gross_monthly_salary: '38000', salary: '38000',
        initial_query: 'I was let go because I refused to remove customer complaints from the compliance register before the auditors came in.',
        incident_description: 'I was let go on Friday, they said it was for insubordination because I refused to follow a direct instruction from my manager. The instruction was to remove three customer complaints from the compliance register before the auditors came in this week. I told him I would not do that and that he must put the request in writing if he wanted me to. Two days later HR called me in and told me my services were terminated with immediate effect. I worked there for four years with no warnings ever. My salary was R38000 a month.'
      },
      pregnancyRetrenchment: {
        ...baseFacts,
        employment_status: 'Dismissed', dismissal_reason_type: 'Retrenchment', incident_date: recentDate(2),
        length_of_service: '2-5y', tenure: '2-5y', gross_monthly_salary: '32000', salary: '32000',
        initial_query: 'I was retrenched two weeks after telling my manager I am pregnant.',
        incident_description: 'I work at a marketing agency and I told my manager two weeks ago that I am pregnant. I am 14 weeks. On Tuesday this week I was called into a meeting and told that they are restructuring and my position is being made redundant. There is one other junior in my team and she is staying. The company is doing well as far as I know, we just signed two new clients last month. They gave me one month notice and a small severance. I have been there three years and never had any performance issues. I earn R32000.'
      },
      cdDiscriminationOverlay: {
        ...baseFacts,
        employment_status: 'Resigned', incident_date: recentDate(21), resignation_date: recentDate(21),
        intolerable_conduct: 'discrimination', intolerable_duration: '3-6 months', grievance_raised: 'Yes, verbally',
        constructive_grievance_raised: 'Yes, verbally', employer_response: 'No action', wait_after_grievance: '<2 weeks',
        colleagues_witnessed: 'Unsure', protected_ground: 'national origin', protected_ground_comparator: 'Yes',
        gross_monthly_salary: '45000', salary: '45000',
        initial_query: 'I resigned three weeks ago because my manager kept making comments about my accent and asking when I am going home.',
        incident_description: 'I resigned three weeks ago because I could not handle it anymore. My new manager who started in January kept making comments about my accent and asking when I am going home. I am from Zimbabwe but I have been working in South Africa legally for six years. He moved me off the senior projects and gave them to a junior who joined last year. I tried to talk to HR about it twice but nothing happened. In the end I just resigned, I had to. Now I am out of work and I want to know what I can do. I was earning R45000 a month.'
      }
    };

    const expectations = {
      whistleblowerMisconduct: [
        ['Primary track remains Misconduct', d => sc(d).track === 'UD-MISCONDUCT'],
        ['Secondary track is AUD', d => sc(d).secondary_track === 'AUD'],
        ['Override includes unlawful instruction refusal', d => flags(d).includes('UNLAWFUL_INSTRUCTION_REFUSAL')],
        ['Legal basis includes LRA s187(1)(h)', d => legal(d).includes('LRA s187(1)(h)')],
        ['Legal basis includes Protected Disclosures Act', d => legal(d).includes('Protected Disclosures Act 26 of 2000')],
        ['Does not incorrectly add protected-ground discrimination', d => !flags(d).includes('PROTECTED_GROUND_DISCRIMINATION')]
      ],
      pregnancyRetrenchment: [
        ['Primary track is Retrenchment', d => sc(d).track === 'UD-RETRENCHMENT'],
        ['Secondary track is AUD', d => sc(d).secondary_track === 'AUD'],
        ['Override includes pregnancy', d => flags(d).includes('PREGNANCY')],
        ['Override includes sham retrenchment', d => flags(d).includes('SHAM_RETRENCHMENT')],
        ['Legal basis includes LRA s187(1)(e)', d => legal(d).includes('LRA s187(1)(e)')],
        ['Legal basis includes BCEA s25', d => legal(d).includes('BCEA s25')]
      ],
      cdDiscriminationOverlay: [
        ['Primary track is Constructive Dismissal', d => sc(d).track === 'CD'],
        ['Secondary track is AUD', d => sc(d).secondary_track === 'AUD'],
        ['Override includes protected-ground discrimination', d => flags(d).includes('PROTECTED_GROUND_DISCRIMINATION')],
        ['Legal basis includes EEA s6', d => legal(d).includes('EEA s6')],
        ['Legal basis includes LRA s187(1)(f)', d => legal(d).includes('LRA s187(1)(f)')]
      ]
    };

    const sc = d => d.scorecard || {};
    const flags = d => sc(d).override_flags || [];
    const legal = d => sc(d).legal_basis || [];

    function evaluate(name, data) {
      const results = expectations[name].map(([label, fn]) => {
        let passed = false;
        try { passed = Boolean(fn(data)); } catch (_) { passed = false; }
        return { label, passed };
      });
      return { passed: results.every(x => x.passed), results };
    }

    function renderStatus(name, evaluation) {
      statusEl.className = `status ${evaluation.passed ? 'pass' : 'fail'}`;
      statusEl.textContent = `${evaluation.passed ? '✅ PASS' : '❌ FAIL'} — ${name}`;
      checksEl.style.display = 'block';
      checksEl.innerHTML = '<h3>Checks</h3>' + evaluation.results.map(r =>
        `<div class="check"><span class="${r.passed ? 'ok' : 'bad'}">${r.passed ? '✅' : '❌'}</span> ${r.label}</div>`
      ).join('');
    }

    async function runTest(name) {
      statusEl.className = 'status running';
      statusEl.textContent = `Running ${name}...`;
      checksEl.style.display = 'none';
      output.textContent = `Running ${name}...`;
      try {
        const res = await fetch('/.netlify/functions/ask', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'evaluate', facts: cases[name] })
        });
        const data = await res.json();
        const evaluation = evaluate(name, data);
        renderStatus(name, evaluation);
        output.textContent = JSON.stringify({
          pass: evaluation.passed,
          checks: evaluation.results,
          httpStatus: res.status,
          caseId: data.caseId,
          hasMerit: data.hasMerit,
          track: sc(data).track,
          secondaryTrack: sc(data).secondary_track,
          overrideFlags: sc(data).override_flags,
          trackLabel: sc(data).track_label,
          substantiveScore: sc(data).substantive_score,
          proceduralScore: sc(data).procedural_score,
          meritBand: sc(data).merit_band,
          wpEligible: sc(data).wp_eligible,
          wpType: sc(data).wp_type,
          legalBasis: sc(data).legal_basis,
          recommendedNextStep: sc(data).recommended_next_step,
          scoringBreakdown: sc(data).scoring_breakdown,
          advisoryNote: data.pitch,
          raw: data
        }, null, 2);
      } catch (err) {
        statusEl.className = 'status fail';
        statusEl.textContent = `❌ ERROR — ${name}`;
        output.textContent = err.stack || err.message;
      }
    }
  </script>
</body>
</html>
