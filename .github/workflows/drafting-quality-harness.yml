name: Temporary drafting quality harness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/drafting-quality-harness.js'
      - '.github/workflows/drafting-quality-harness.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VRS_SKILL_VERSION: v1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node scripts/drafting-quality-harness.js
