name: Temporary multilingual intake check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/multilingual-intake-check.js'
      - 'netlify/functions/lib/llmGovernance.js'
      - 'netlify/functions/lib/whatsappConversation.js'
      - 'netlify/functions/lib/consentConfig.js'
      - 'netlify/functions/ask.js'
      - 'netlify/functions/lib/claudeDrafting.js'
      - 'index.html'
      - '.github/workflows/multilingual-intake-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node --check netlify/functions/lib/llmGovernance.js
      - run: node --check netlify/functions/lib/whatsappConversation.js
      - run: node --check netlify/functions/ask.js
      - run: node --check netlify/functions/lib/claudeDrafting.js
      - run: node scripts/multilingual-intake-check.js
