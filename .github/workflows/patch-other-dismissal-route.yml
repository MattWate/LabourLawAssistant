name: Patch dismissal other route
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-other-dismissal-route.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WhatsApp question flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/lib/whatsappConversation.js')
          s = p.read_text()
          old = "    choice('Other', 'Other', 'A2_MISCONDUCT_CATEGORY')\n  ]),\n\n  A2_MISCONDUCT_CATEGORY:"
          new = "    choice('Other', 'Other', 'FIRED_REASON_OTHER_EXPLANATION')\n  ]),\n  FIRED_REASON_OTHER_EXPLANATION: text('Please explain the reason your employer gave for dismissing you.', 'dismissal_reason_other_explanation', 'COMPANY_NAME', { minWords: 3 }),\n\n  A2_MISCONDUCT_CATEGORY:"
          if old not in s:
              raise SystemExit('Expected dismissal route block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/lib/whatsappConversation.js
          git commit -m "Route other dismissal reasons to explanation" || exit 0
          git push
