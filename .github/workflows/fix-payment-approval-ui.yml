name: Fix payment approval UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-payment-approval-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch workstation behaviour
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-workstation.html')
          text = path.read_text()

          replacements = {
            "function selectCase(id) { selectedCaseId = id; renderWorkstation(); }": "function selectCase(id) { selectedCaseId = id; currentView = 'workstation'; render(); }",
            "await saveCaseFacts(id);\n        const res = await fetch('/.netlify/functions/approve_case_for_payment'": "await saveCaseFacts(id, false);\n        const res = await fetch('/.netlify/functions/approve_case_for_payment'",
            "async function saveCaseFacts(id) {": "async function saveCaseFacts(id, refresh = true) {",
            "toast('Case facts saved.');\n      await fetchCases();": "if (refresh) {\n        toast('Case facts saved.');\n        await fetchCases();\n      }"
          }

          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected workstation text not found: {old}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/fix-payment-approval-ui.yml').unlink()
          PY
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html .github/workflows/fix-payment-approval-ui.yml
          git commit -m "Keep payment approval case open"
          git push