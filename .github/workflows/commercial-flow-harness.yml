name: Commercial Flow Harness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/approve_case_for_payment.js'
      - 'netlify/functions/create_payfast_payment.js'
      - 'netlify/functions/payfast_itn.js'
      - 'netlify/functions/manual_confirm_payment.js'
      - 'admin-workstation.html'
      - 'netlify/functions/generate_letter.js'
      - 'netlify/functions/generate_letter-background.js'
      - 'netlify/functions/manage_letter_release.js'
      - 'netlify/functions/client_letter_review.js'
      - 'netlify/functions/client_case_consent.js'
      - 'netlify/functions/lib/email.js'
      - 'netlify/functions/lib/pdfDocument.js'
      - 'scripts/commercial-flow-harness.js'
      - '.github/workflows/commercial-flow-harness.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node scripts/commercial-flow-harness.js
      - run: node --check netlify/functions/manual_confirm_payment.js
      - run: node --check netlify/functions/payfast_itn.js
      - run: node -e "const fs=require('fs');const s=fs.readFileSync('admin-workstation.html','utf8');const m=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)];fs.writeFileSync('/tmp/justine-admin.js',m.map(x=>x[1]).join('\\n'));"
      - run: node --check /tmp/justine-admin.js
