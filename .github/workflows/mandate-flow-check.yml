name: Temporary mandate flow check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/mandate-flow-check.js'
      - 'netlify/functions/lib/consentConfig.js'
      - 'netlify/functions/lib/whatsappConversation.js'
      - 'netlify/functions/approve_case_for_payment.js'
      - 'netlify/functions/ask.js'
      - 'index.html'
      - 'admin-workstation.html'
      - '.github/workflows/mandate-flow-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/lib/consentConfig.js
      - run: node --check netlify/functions/lib/whatsappConversation.js
      - run: node --check netlify/functions/approve_case_for_payment.js
      - run: node --check netlify/functions/ask.js
      - run: node scripts/mandate-flow-check.js
