name: Temporary Etienne intake regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin-workstation.html'
      - 'netlify/functions/ask.js'
      - 'netlify/functions/lib/llmGovernance.js'
      - 'netlify/functions/approve_case_for_payment.js'
      - '.github/workflows/etienne-intake-regression.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/ask.js
      - run: node --check netlify/functions/lib/llmGovernance.js
      - run: node --check netlify/functions/approve_case_for_payment.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('index.html','utf8');
          const admin=fs.readFileSync('admin-workstation.html','utf8');
          const ask=fs.readFileSync('netlify/functions/ask.js','utf8');
          const gov=fs.readFileSync('netlify/functions/lib/llmGovernance.js','utf8');
          const pay=fs.readFileSync('netlify/functions/approve_case_for_payment.js','utf8');

          for (const marker of [
            'RESERVED_CONTACT_STATES',
            'I have enough information for a first assessment',
            'currentState = "CLIENT_NAME"',
            'currentState = "CLIENT_EMAIL"',
            'currentState = "CLIENT_PHONE"',
            'currentState = "HANDOFF"',
            'date_requires_client_confirmation',
            'hasExplicitYear'
          ]) if(!index.includes(marker)) throw new Error('index missing '+marker);

          if(index.includes('action: "intake_handoff", reason, missing')) throw new Error('prompt cap still hard-handoffs');

          for(const marker of [
            'Never infer or guess a year',
            'incident_date must be null/omitted'
          ]) if(!gov.includes(marker)) throw new Error('governance missing '+marker);

          for(const marker of [
            'ordinary 30-day CCMA referral period appears to have passed',
            'Do not wait for settlement discussions before protecting the deadline',
            'whatsapp_number: facts.whatsapp_number || null'
          ]) if(!ask.includes(marker)) throw new Error('ask missing '+marker);

          for(const marker of [
            'id="new-client-email"',
            'id="new-whatsapp-number"',
            "client_email:'Client Email'",
            "whatsapp_number:'WhatsApp Number'",
            'UD-POOR_PERFORMANCE',
            'UD-INCAPACITY',
            'UD-MISCONDUCT'
          ]) if(!admin.includes(marker)) throw new Error('admin missing '+marker);
          if(admin.includes('id="new-contact-info"')) throw new Error('old single new-contact field remains');

          for(const marker of [
            'function ensureMandateConversation',
            'facts.whatsapp_number || facts.contact_info || caseData.contact_info',
            'const mandateConversation = await ensureMandateConversation',
            'const consentConversation = await ensureMandateConversation'
          ]) if(!pay.includes(marker)) throw new Error('payment recovery missing '+marker);

          console.log('PASS Etienne intake regression');
          NODE
