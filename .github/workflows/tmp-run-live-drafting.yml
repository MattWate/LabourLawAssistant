name: Temporary run live drafting harness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-run-live-drafting.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Netlify deploy and run fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-harness-results
          base="https://labourlawassist.netlify.app/.netlify/functions/tmp_fixed_drafting_run_8f2c1d"
          for fixture in misconduct performance retrenchment; do
            echo "Running $fixture..."
            ok=0
            for i in {1..30}; do
              code=$(curl -sS -L --max-time 180 -o "tmp-harness-results/$fixture.json" -w "%{http_code}" "$base?fixture=$fixture" || true)
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              echo "Attempt $i returned HTTP $code; waiting for deploy..."
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Failed $fixture"
              cat "tmp-harness-results/$fixture.json" || true
              exit 1
            fi
            python -m json.tool "tmp-harness-results/$fixture.json" >/dev/null
          done
      - name: Commit temporary results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-harness-results/*.json
          git commit -m "Store temporary live drafting harness results"
          git push
