name: Apply date validation fix
on:
  push:
    paths:
      - '.github/scripts/apply-date-validation-fix.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/apply-date-validation-fix.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/lib/whatsappConversation.js netlify/functions/lib/scoringEngine.js admin-review.html
          git diff --cached --quiet || git commit -m "Validate WhatsApp dates before scoring"
          git push
