name: Patch draft polling UX
on:
  push:
    paths:
      - '.github/workflows/patch-draft-polling.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/patch-draft-polling.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-workstation.html
          git commit -m "Improve draft generation polling UX"
          git push
