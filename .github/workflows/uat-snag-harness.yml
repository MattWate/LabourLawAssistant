name: Temporary UAT snag harness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/uat-snag-harness.js'
      - 'netlify/functions/**'
      - 'index.html'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/uat-snag-harness.yml'
  workflow_dispatch:

jobs:
  uat-snag-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --ignore-scripts
      - run: node scripts/uat-snag-harness.js
