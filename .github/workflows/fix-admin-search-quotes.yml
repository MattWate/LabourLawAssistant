name: Fix admin search quotes
on:
  push:
    paths:
      - '.github/workflows/fix-admin-search-quotes.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: node .github/scripts/fix-admin-search-quotes.js
      - run: |
          rm -f .github/scripts/fix-admin-search-quotes.js .github/workflows/fix-admin-search-quotes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html .github/scripts/fix-admin-search-quotes.js .github/workflows/fix-admin-search-quotes.yml
          git commit -m "Fix persistent admin search handlers"
          git push origin HEAD:main
