name: Patch paid drafting workstation UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-paid-drafting-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin workstation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-workstation.html')
          s = p.read_text()
          replacements = [
            ("<button class=\"btn ghost\" onclick=\"setQueueFilter('payment');setView('workstation')\">Awaiting Payment</button>\n        <button class=\"btn ghost\" onclick=\"setQueueFilter('drafting');setView('workstation')\">Drafting Queue</button>",
             "<button class=\"btn ghost\" onclick=\"setQueueFilter('payment');setView('workstation')\">Awaiting Payment</button>\n        <button class=\"btn ghost\" onclick=\"setQueueFilter('paid');setView('workstation')\">Paid – Ready to Draft</button>\n        <button class=\"btn ghost\" onclick=\"setQueueFilter('drafting');setView('workstation')\">Drafting Queue</button>"),
            ("if (c.payment_status === 'pending' || c.status === 'payment_pending') return 'payment_pending';\n      if (q) return 'needs_info';",
             "if (c.payment_status === 'paid' && c.status === 'paid_ready_for_drafting') return 'paid_ready_for_drafting';\n      if (c.payment_status === 'pending' || c.status === 'payment_pending') return 'payment_pending';\n      if (q) return 'needs_info';"),
            ("payment: active.filter(c => statusOf(c) === 'payment_pending').length,\n        drafting: active.filter(c => statusOf(c) === 'needs_drafting').length,",
             "payment: active.filter(c => statusOf(c) === 'payment_pending').length,\n        paid: active.filter(c => statusOf(c) === 'paid_ready_for_drafting').length,\n        drafting: active.filter(c => ['needs_drafting','drafting_in_progress'].includes(statusOf(c))).length,"),
            ("metric('Awaiting Payment', s.payment, 'Payment link issued', \"setQueueFilter('payment');setView('workstation')\") +\n        metric('Drafting Queue', s.drafting, 'Ready for letter', \"setQueueFilter('drafting');setView('workstation')\") +",
             "metric('Awaiting Payment', s.payment, 'Payment link issued', \"setQueueFilter('payment');setView('workstation')\") +\n        metric('Paid – Ready to Draft', s.paid, 'Payment confirmed', \"setQueueFilter('paid');setView('workstation')\") +\n        metric('Drafting Queue', s.drafting, 'Drafting underway', \"setQueueFilter('drafting');setView('workstation')\") +"),
            ("if (currentQueueFilter === 'payment' && statusOf(c) !== 'payment_pending') return false;\n        if (currentQueueFilter === 'drafting' && statusOf(c) !== 'needs_drafting') return false;",
             "if (currentQueueFilter === 'payment' && statusOf(c) !== 'payment_pending') return false;\n        if (currentQueueFilter === 'paid' && statusOf(c) !== 'paid_ready_for_drafting') return false;\n        if (currentQueueFilter === 'drafting' && !['needs_drafting','drafting_in_progress'].includes(statusOf(c))) return false;"),
            ("chip('all','All') + chip('active','Active') + chip('review','Review') + chip('info','Needs Info') + chip('payment','Awaiting Payment') + chip('drafting','Drafting') +",
             "chip('all','All') + chip('active','Active') + chip('review','Review') + chip('info','Needs Info') + chip('payment','Awaiting Payment') + chip('paid','Paid – Ready') + chip('drafting','Drafting') +"),
            ("payment_pending:['Awaiting Payment','amber'], attorney_review:['Review','purple'], pending_review:['Draft Review','amber'], approved:['Approved','green'], needs_drafting:['Drafting','blue'], new:['New','blue']",
             "payment_pending:['Awaiting Payment','amber'], paid_ready_for_drafting:['Paid – Ready to Draft','green'], drafting_in_progress:['Drafting','blue'], attorney_review:['Review','purple'], pending_review:['Draft Review','amber'], approved:['Approved','green'], needs_drafting:['Drafting','blue'], new:['New','blue']"),
            ("if (c.payment_status === 'paid') return '<span class=\"badge green\">Payment received</span>';",
             "if (c.payment_status === 'paid') return '<span class=\"badge green\">Payment received ' + esc(date(c.paid_at)) + '</span>';"),
            ("if (f.wants_letter) return '<div class=\"card\"><h3>Letter Action</h3><p style=\"color:var(--muted);line-height:1.5\">This matter is marked as requiring a letter. Save corrected facts first, then generate a draft.</p><button id=\"btn-generate-' + c.id + '\" class=\"btn warn\" onclick=\"generateDraft(\\'' + c.id + '\\')\">Generate Draft Letter</button></div>';",
             "if (f.wants_letter) { const paid = c.payment_status === 'paid' && (c.wp_generation_unlocked === true || f.wp_generation_unlocked === true); return '<div class=\"card\"><h3>Letter Action</h3><p style=\"color:var(--muted);line-height:1.5\">' + (paid ? 'Payment is confirmed. Save corrected facts, then start the controlled draft.' : 'Drafting is locked until PayFast confirms payment.') + '</p><button id=\"btn-generate-' + c.id + '\" class=\"btn warn\" ' + (paid ? '' : 'disabled') + ' onclick=\"generateDraft(\\'' + c.id + '\\')\">' + (paid ? 'Generate Draft Letter' : 'Awaiting Confirmed Payment') + '</button></div>'; }"),
            ("if (!res.ok) throw new Error('Draft generation failed.');\n        toast('Draft generated.');",
             "let result = {}; try { result = await res.json(); } catch (e) {}\n        if (!res.ok) throw new Error(result.error || 'Draft generation failed.');\n        toast(result.message || 'Draft generation started.');")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Missing expected admin snippet: ' + old[:120])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html
          git commit -m "Add paid ready to draft workstation flow"
          git push
