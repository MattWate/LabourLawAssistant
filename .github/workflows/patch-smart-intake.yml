name: Patch smart intake conversation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-smart-intake.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch intake extraction and skipping
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Validate JavaScript syntax
        run: |
          node --check netlify/functions/lib/whatsappConversation.js
          node --check netlify/functions/lib/llmGovernance.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/lib/whatsappConversation.js netlify/functions/lib/llmGovernance.js
          git commit -m "Skip answered WhatsApp intake questions" || exit 0
          git push
