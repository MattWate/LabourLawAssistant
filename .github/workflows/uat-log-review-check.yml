name: Temporary UAT log review harness check
on:
  push:
    branches: [main]
    paths:
      - 'uat-log-review.html'
      - 'netlify/functions/uat_log_review.js'
      - '.github/workflows/uat-log-review-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/uat_log_review.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const api=fs.readFileSync('netlify/functions/uat_log_review.js','utf8');
          const ui=fs.readFileSync('uat-log-review.html','utf8');
          for(const marker of [
            "OLD_PROMPT_LIMIT_HANDOFF",
            "LEGACY_AI_DATE_AUTO_CONFIRMED",
            "DEADLINE_LAPSED",
            "DEADLINE_URGENT",
            "MANDATE_NO_CHANNEL",
            "_intake_prompt_history",
            "fact_metadata",
            "llm_call_logs",
            "processed_message_ids",
            "transcript_warning",
            "SUPABASE_SERVICE_ROLE_KEY"
          ]) if(!api.includes(marker)) throw new Error('API missing '+marker);
          for(const marker of [
            'Justine UAT Intake Review',
            '/.netlify/functions/uat_log_review',
            'Export review JSON',
            'Intake / prompt history',
            'Date provenance / deadline',
            'Mandate / payment / progression',
            'Fact provenance / LLM audit'
          ]) if(!ui.includes(marker)) throw new Error('UI missing '+marker);
          if(/\.update\(|\.insert\(|\.delete\(/.test(api.replace(/service\.from\('cases'\)\.select/g,''))) {
            // no database mutations should exist; false positive allowed only for JS collection methods,
            // so explicitly reject Supabase mutation chains.
            if(/service\.from\([^\n]+\)\.(?:update|insert|delete)|supabase\.from\([^\n]+\)\.(?:update|insert|delete)/.test(api)) throw new Error('Harness backend is not read-only');
          }
          console.log('PASS UAT log review harness checks');
          NODE
