name: Temporary harness endpoint diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-harness-diagnostic.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoint without invoking Claude
        shell: bash
        run: |
          set -e
          url="https://labourlawassist.netlify.app/.netlify/functions/tmp_fixed_drafting_run_8f2c1d?fixture=invalid"
          code=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/out -w "%{http_code}" "$url" || true)
          echo "HTTP=$code"
          cat /tmp/out || true
          test "$code" = "400"
