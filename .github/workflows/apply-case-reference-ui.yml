name: Apply case reference rollout

on:
  push:
    paths:
      - '.github/workflows/apply-case-reference-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Apply patch
        run: node .github/scripts/apply-case-reference-ui.js
      - name: Commit patch and cleanup
        run: |
          rm -f .github/scripts/apply-case-reference-ui.js .github/workflows/apply-case-reference-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html index.html netlify/functions/ask.js netlify/functions/lib/whatsappProductionConversation.js .github/scripts/apply-case-reference-ui.js .github/workflows/apply-case-reference-ui.yml
          git commit -m "Add client-facing case references"
          git push origin HEAD:main
