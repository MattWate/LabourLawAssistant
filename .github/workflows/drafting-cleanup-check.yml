name: Temporary drafting cleanup check
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/lib/claudeDrafting.js'
      - 'netlify/functions/lib/scoringEngine.js'
      - '.github/workflows/drafting-cleanup-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/lib/claudeDrafting.js
      - run: node --check netlify/functions/lib/scoringEngine.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('netlify/functions/lib/claudeDrafting.js','utf8');
          for(const marker of [
            'function currentLawSkillContext',
            'Do not use "and/or" between sections 37 and 38',
            'do not infer that a manager laid, initiated or formulated a disciplinary charge',
            'substantial settlement amount calibrated',
            'Any reference to "Schedule 8" in the outward-facing draft is a mandatory defect',
            'without "and/or"'
          ]) if(!src.toLowerCase().includes(marker.toLowerCase())) throw new Error('Missing cleanup marker: '+marker);
          if(src.includes('section 37 and/or any more favourable')) throw new Error('Old and/or guidance remains');
          console.log('PASS drafting cleanup checks');
          NODE
