name: Patch letter release UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-letter-release.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin workstation
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Validate
        run: |
          node --check netlify/functions/manage_letter_release.js
          python - <<'PY'
          from pathlib import Path
          s=Path('admin-workstation.html').read_text()
          js=s.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/admin-workstation.js').write_text(js)
          PY
          node --check /tmp/admin-workstation.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html
          git commit -m "Add controlled letter release controls" || exit 0
          git push
