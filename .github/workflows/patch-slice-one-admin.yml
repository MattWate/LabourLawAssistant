name: Patch slice one admin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-slice-one-admin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin workstation
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin-workstation.html')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected admin fragment not found: {old[:120]}')
              text = text.replace(old, new, 1)

          replace_once(
              '<button class="btn ghost" onclick="setQueueFilter(\'info\');setView(\'workstation\')">Needs More Info</button>\n        <button class="btn ghost" onclick="setQueueFilter(\'drafting\');setView(\'workstation\')">Drafting Queue</button>',
              '<button class="btn ghost" onclick="setQueueFilter(\'info\');setView(\'workstation\')">Needs More Info</button>\n        <button class="btn ghost" onclick="setQueueFilter(\'payment\');setView(\'workstation\')">Awaiting Payment</button>\n        <button class="btn ghost" onclick="setQueueFilter(\'drafting\');setView(\'workstation\')">Drafting Queue</button>'
          )

          replace_once(
              "      if (c.status === 'archived') return 'archived';\n      if (q) return 'needs_info';",
              "      if (c.status === 'archived') return 'archived';\n      if (c.payment_status === 'pending' || c.status === 'payment_pending') return 'payment_pending';\n      if (q) return 'needs_info';"
          )

          replace_once(
              "        info: active.filter(c => statusOf(c) === 'needs_info').length,\n        drafting:",
              "        info: active.filter(c => statusOf(c) === 'needs_info').length,\n        payment: active.filter(c => statusOf(c) === 'payment_pending').length,\n        drafting:"
          )

          replace_once(
              "        metric('Needs More Info', s.info, 'Waiting on client', \"setQueueFilter('info');setView('workstation')\") +\n        metric('Drafting Queue'",
              "        metric('Needs More Info', s.info, 'Waiting on client', \"setQueueFilter('info');setView('workstation')\") +\n        metric('Awaiting Payment', s.payment, 'Payment link issued', \"setQueueFilter('payment');setView('workstation')\") +\n        metric('Drafting Queue'"
          )

          replace_once(
              "        if (currentQueueFilter === 'info' && statusOf(c) !== 'needs_info') return false;\n        if (currentQueueFilter === 'drafting'",
              "        if (currentQueueFilter === 'info' && statusOf(c) !== 'needs_info') return false;\n        if (currentQueueFilter === 'payment' && statusOf(c) !== 'payment_pending') return false;\n        if (currentQueueFilter === 'drafting'"
          )

          replace_once(
              "chip('all','All') + chip('active','Active') + chip('review','Review') + chip('info','Needs Info') + chip('drafting','Drafting')",
              "chip('all','All') + chip('active','Active') + chip('review','Review') + chip('info','Needs Info') + chip('payment','Awaiting Payment') + chip('drafting','Drafting')"
          )

          replace_once(
              "const map = { archived:['Archived','red'], needs_info:['Needs Info','amber'], attorney_review:['Review','purple']",
              "const map = { archived:['Archived','red'], needs_info:['Needs Info','amber'], payment_pending:['Awaiting Payment','amber'], attorney_review:['Review','purple']"
          )

          replace_once(
              "<div class=\"mini-actions\"><button class=\"btn warn\" onclick=\"openOverrideModal()\">Override Decision</button>",
              "<div class=\"mini-actions\">' + paymentAction(c) + '<button class=\"btn warn\" onclick=\"openOverrideModal()\">Override Decision</button>"
          )

          replace_once(
              "    function fact(label, value, wide = false) {",
              "    function paymentAction(c) {\n      const ed = effective(c);\n      if (c.payment_status === 'paid') return '<span class=\"badge green\">Payment received</span>';\n      if (c.payment_status === 'pending' || c.status === 'payment_pending') return '<button class=\"btn ghost\" disabled>Payment Requested</button>';\n      if (!bool(ed.wp_eligible)) return '';\n      return '<button id=\"btn-payment-' + c.id + '\" class=\"btn success\" onclick=\"approveCaseForPayment(\\\'' + c.id + '\\\')\">Approve & Request Payment</button>';\n    }\n\n    function fact(label, value, wide = false) {"
          )

          replace_once(
              "statusBadge(statusOf(c)) + '<span class=\"badge blue\">' + esc(c.letter_status || 'no letter')",
              "statusBadge(statusOf(c)) + '<span class=\"badge ' + (c.payment_status === 'paid' ? 'green' : c.payment_status === 'pending' ? 'amber' : 'blue') + '\">Payment: ' + esc(c.payment_status || 'not requested') + '</span><span class=\"badge blue\">' + esc(c.letter_status || 'no letter')"
          )

          replace_once(
              "    async function updateCase(payload) {",
              "    async function approveCaseForPayment(id) {\n      const c = casesData.find(x => x.id === id);\n      if (!c) return toast('Case not found.');\n      const f = facts(c);\n      if (!confirm('Approve this case and send the client a PayFast payment request?')) return;\n      const btn = $('btn-payment-' + id);\n      if (btn) { btn.disabled = true; btn.textContent = 'Creating Payment...'; }\n      try {\n        await saveCaseFacts(id);\n        const res = await fetch('/.netlify/functions/approve_case_for_payment', {\n          method: 'POST',\n          headers: headers(),\n          body: JSON.stringify({ caseId: id })\n        });\n        let result = {};\n        try { result = await res.json(); } catch (e) {}\n        if (!res.ok) throw new Error(result.error || 'Could not approve case for payment.');\n        const channel = result.whatsapp_mode === 'template' ? 'WhatsApp template' : result.whatsapp_sent ? 'WhatsApp message' : 'payment link';\n        toast('Case approved. The ' + channel + ' was created successfully.');\n        await fetchCases();\n      } catch (e) {\n        toast(e.message || 'Payment approval failed.');\n        if (btn) { btn.disabled = false; btn.textContent = 'Approve & Request Payment'; }\n      }\n    }\n\n    async function updateCase(payload) {"
          )

          path.write_text(text)
      - name: Commit patched workstation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-workstation.html
          git commit -m "Add payment approval controls to admin workstation"
          git push
