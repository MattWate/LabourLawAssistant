name: Apply friendly intake copy
on:
  push:
    paths:
      - '.github/scripts/apply-friendly-intake-copy.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/apply-friendly-intake-copy.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html netlify/functions/lib/whatsappConversation.js
          git diff --cached --quiet || git commit -m "Make client intake questions warmer and simpler"
          git push
