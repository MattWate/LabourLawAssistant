name: Temporary live drafting harness check
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/drafting_quality_harness.js'
      - 'drafting-quality-harness.html'
      - '.github/workflows/live-drafting-harness-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/drafting_quality_harness.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const api=fs.readFileSync('netlify/functions/drafting_quality_harness.js','utf8');
          const page=fs.readFileSync('drafting-quality-harness.html','utf8');
          if(!api.includes('auth.getUser')) throw new Error('Harness is not authenticated');
          if(api.includes(".from('cases').insert") || api.includes(".from('cases').update") || api.includes('sendWhatsApp') || api.includes('sendEmail')) throw new Error('Harness contains a side-effect path');
          if(!api.includes('callClaudeForWpDraft')) throw new Error('Harness does not use production drafting stack');
          if(!page.includes('Download JSON')) throw new Error('Harness export control missing');
          console.log('PASS temporary live drafting harness checks');
          NODE
