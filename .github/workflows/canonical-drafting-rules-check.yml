name: Temporary canonical drafting rules check
on:
  push:
    branches: [main]
    paths:
      - 'netlify/functions/lib/claudeDrafting.js'
      - '.github/workflows/canonical-drafting-rules-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/lib/claudeDrafting.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('netlify/functions/lib/claudeDrafting.js','utf8');
          for(const marker of [
            'function enforceOutwardDraftRules',
            'Payment in lieu of notice calculated by reference to the applicable notice period under section 37',
            'with payment made in accordance with section 38',
            'cumulative procedural shortcomings identified above',
            'Internal scoring labels such as "HIGH merit"',
            'continuous_service',
            'skillContext: currentLawSkillContext(skillContext)'
          ]) if(!src.includes(marker)) throw new Error('Missing canonical rule: '+marker);
          if(src.includes('section 37 and/or any more favourable')) throw new Error('Old notice wording remains');
          console.log('PASS canonical drafting rules');
          NODE
