name: Temporary parallel live drafting harness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-run-live-drafting-parallel.yml']
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        fixture: [misconduct, performance, retrenchment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.fixture }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-harness-results
          url="https://labourlawassist.netlify.app/.netlify/functions/tmp_fixed_drafting_run_8f2c1d?fixture=${{ matrix.fixture }}"
          code=$(curl -sS -L --connect-timeout 10 --max-time 600 -o "tmp-harness-results/${{ matrix.fixture }}.json" -w "%{http_code}" "$url")
          echo "HTTP=$code"
          if [ "$code" != "200" ]; then
            cat "tmp-harness-results/${{ matrix.fixture }}.json" || true
            exit 1
          fi
          python -m json.tool "tmp-harness-results/${{ matrix.fixture }}.json" >/dev/null
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tmp-harness-results/${{ matrix.fixture }}.json"
          git commit -m "Store temporary live drafting result: ${{ matrix.fixture }}"
          for i in {1..5}; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1