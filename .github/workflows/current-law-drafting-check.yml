name: Temporary current law drafting regression
on:
  push:
    branches: [main]
    paths:
      - 'scripts/current-law-drafting-check.js'
      - 'netlify/functions/lib/scoringEngine.js'
      - 'netlify/functions/lib/overridePostProcessor.js'
      - 'netlify/functions/lib/claudeDrafting.js'
      - 'netlify/functions/lib/liveDraftingFixtures.js'
      - '.github/workflows/current-law-drafting-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check netlify/functions/lib/scoringEngine.js
      - run: node --check netlify/functions/lib/overridePostProcessor.js
      - run: node --check netlify/functions/lib/claudeDrafting.js
      - run: node scripts/current-law-drafting-check.js
