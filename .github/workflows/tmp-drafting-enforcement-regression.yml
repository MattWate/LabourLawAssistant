name: Temporary drafting enforcement regression
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tmp-drafting-enforcement-regression.js'
      - 'netlify/functions/lib/claudeDrafting.js'
      - '.github/workflows/tmp-drafting-enforcement-regression.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-drafting-enforcement-regression.js
