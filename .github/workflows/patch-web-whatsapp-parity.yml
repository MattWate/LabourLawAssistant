name: Patch web WhatsApp parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-web-whatsapp-parity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch web flow and WhatsApp linking
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Validate backend JavaScript
        run: node --check netlify/functions/ask.js
      - name: Validate embedded web JavaScript
        run: python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/web.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0])" && node --check /tmp/web.js
      - name: Commit parity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html netlify/functions/ask.js
          git commit -m "Align web intake with WhatsApp flow" || exit 0
          git push
