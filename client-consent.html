<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VRS Client Consent</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.shell{max-width:720px;margin:auto;padding:36px 18px}.card{background:#fff;border:1px solid #d9e0ee;border-radius:18px;padding:26px;box-shadow:0 16px 40px rgba(0,11,79,.08)}h1{color:#000B4F}.text{white-space:pre-wrap;line-height:1.65;background:#f7f9fc;padding:16px;border-radius:10px}.row{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.btn{border:0;border-radius:10px;padding:12px 18px;background:#20368F;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.error{color:#a63d45}.success{color:#247553;font-weight:700}.muted{color:#59647d}
</style></head>
<body><main class="shell"><div class="card"><div style="font-weight:700;color:#000B4F">VRS LABOUR LAW CONSULTANTS</div><div id="loading">Loading…</div><div id="content" style="display:none"><h1 id="heading"></h1><p class="muted" id="reference"></p><div class="text" id="copy"></div><label class="row"><input type="checkbox" id="accept"/><span id="label"></span></label><button class="btn" id="submit">Accept and continue</button><p id="result"></p></div><p id="fatal" class="error"></p></div></main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const endpoint='/.netlify/functions/client_case_consent?token='+encodeURIComponent(token);
const $=id=>document.getElementById(id);
function render(d){$('loading').style.display='none';$('content').style.display='block';$('heading').textContent=d.heading;$('reference').textContent='Reference: '+d.case_reference;$('copy').textContent=d.text;$('label').textContent=d.checkbox_label;$('accept').checked=false;$('result').textContent='';}
async function load(){try{const r=await fetch(endpoint,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load consent.');render(d);}catch(e){$('loading').style.display='none';$('fatal').textContent=e.message;}}
$('submit').onclick=async()=>{if(!$('accept').checked){$('result').className='error';$('result').textContent='Please tick the box before continuing.';return;}$('submit').disabled=true;$('result').className='';$('result').textContent='Submitting…';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'accept'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not record consent.');if(d.completed){$('content').innerHTML='<h1>Thank you</h1><p class="success">'+d.message+'</p>';}else{render(d);$('result').className='success';$('result').textContent=d.message||'';}}catch(e){$('submit').disabled=false;$('result').className='error';$('result').textContent=e.message;}};
load();
</script></body></html>
